[package]
name = "bench"
version = "0.0.0"
edition = "2021"

[dependencies]
regex = "1.13"
regex-automata = "0.4"
aho-corasick = "1.1"

[[bin]]
name = "gen"
path = "src/gen.rs"

[[bin]]
name = "bench"
path = "src/bench.rs"

[[bin]]
name = "teddy"
path = "src/teddy.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
